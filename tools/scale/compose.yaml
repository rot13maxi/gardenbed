# Horizontal scale-out deployment (docs/scale-out-design.md, D4):
# Postgres for metadata, MinIO for objects, and N stateless
# `gardenbed-server` replicas behind the same two backing services.
#
#   docker compose -f tools/scale/compose.yaml up --scale server=3
#
# (The file already sets `deploy.replicas: 3`; `docker compose up` honors
# it when the `--scale` flag is not given.)
#
# MinIO comes from the `pgsty/minio` community mirror because minio/minio
# left Docker Hub and quay (Sept 2026); the S3 API is identical. The same
# image also ships `mc`, so the one-shot bucket creator reuses it.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gardenbed
      POSTGRES_PASSWORD: gardenbed
      POSTGRES_DB: gardenbed
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gardenbed -d gardenbed"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gardenbed
      MINIO_ROOT_PASSWORD: gardenbed-secret
    ports:
      - "55900:9000"
      - "55901:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # CMD-SHELL runs `/bin/sh` directly, bypassing the image's `minio`
      # entrypoint; the shipped `mc` pings the server's own :9000.
      test: ["CMD-SHELL", "mc ready local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot bucket creator: the pgsty/minio image ships `mc`, so no
  # extra image is needed. `mc mb` succeeds when the bucket already
  # exists (it prints a notice and exits 0).
  createbuckets:
    image: pgsty/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 gardenbed gardenbed-secret &&
      mc mb --ignore-existing local/gardenbed
      "

  server:
    build:
      context: ../..
      dockerfile: tools/scale/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    # Bind all interfaces: docker-proxy dials the container's IP, so the
    # default 127.0.0.1:9418 would refuse published-port traffic.
    command: ["serve", "--addr", "0.0.0.0:9418", "--storage", "/etc/gardenbed/storage.toml"]
    volumes:
      - ./storage.toml:/etc/gardenbed/storage.toml:ro
    deploy:
      replicas: 3
    # Replicas get distinct host ports on the host side only for
    # convenience pointing `bed` at one of them; the compose network
    # balances nothing (a load balancer is a deployment concern, not a
    # compose one — see the design doc's "Out of scope").
    ports:
      - "9418-9420:9418"

volumes:
  pgdata:
  miniodata:
