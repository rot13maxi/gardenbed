[package]
name = "gardenbed-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gardenbed-mcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gardenbed-model.workspace = true
# The MCP tools answer through the server's own service layer
# (`gardenbed_server::Repo`) in-process — parity with the CLI's server is
# by construction, and the server opens with no working copy anywhere.
gardenbed-server = { path = "../server" }
gardenbed-derive = { path = "../derive" }
serde_json = "1"
# `qa` lives in the library (the integration test and the example both
# run its scripted agent), so its fixture machinery rides here: the
# harness generator/oracle produce the history and the git ground truth,
# and tempfile holds the fixture roots.
gardenbed-harness = { path = "../harness" }
tempfile = "3"

[dev-dependencies]
gardenbed = { path = "../bed" }
