# Storage configuration for the scale-out deployment
# (docs/scale-out-design.md, D3). This is the file the compose `server`
# replicas load from /etc/gardenbed/storage.toml; the hostnames are
# compose-internal service names.
#
# For local single-machine mode, keep using `--root` (the default); this
# file only configures the scaled backends.

[metadata]
backend = "postgres"
url = "postgres://gardenbed:gardenbed@postgres:5432/gardenbed"

[objects]
backend = "s3"
endpoint = "http://minio:9000"
bucket = "gardenbed"
region = "us-east-1"
access_key = "gardenbed"
secret_key = "gardenbed-secret"
path_style = true
