[package]
name = "gardenbed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gardenbed"
path = "src/lib.rs"

[[bin]]
name = "bed"
path = "src/main.rs"

[dependencies]
bstr = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
http = "1"
gardenbed-model.workspace = true
# Not in `[workspace.dependencies]` yet; path until the orchestrator adds it.
gardenbed-store = { path = "../store" }
# The wire client (M4 read path): thin, runtime-only — bed never links the
# server; tests ingest fixtures through `gardenbed-server` as a dev-dep.
# The local daemon tier (v0.2 M16): bed links only the daemon *library* —
# the generated sidecar client and path rules. bed never spawns the
# daemon binary and never depends on it being present.
gardenbed-daemon = { path = "../daemon" }
gardenbed-protocol = { path = "../protocol" }
# .gitignore pattern matching for untracked-file discovery (status/commit).
# Same version the `gix` dependency in crates/git already locks.
gix-glob = "0.29.0"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    # Runtime knobs the binary needs plus the ones the integration tests
    # use (#[tokio::test], spawned processes, timeouts). Additive.
    "macros",
    "time",
    "process",
    "io-util",
    # `bed mount`'s foreground loop waits on SIGINT/SIGTERM.
    "signal",
] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "channel"] }
toml = "1"
fuser = "0.18.0"
parking_lot = "0.12.5"

# Unix only: `bed` restores the default SIGPIPE disposition at startup so
# a closed pipe (`bed log | head`) dies silently like git, not with a
# `failed printing to stdout` panic (Rust ignores SIGPIPE by default).
# Windows has no SIGPIPE; nothing to restore there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gardenbed-harness = { path = "../harness" }
# Dev-only: the server, for ingesting fixtures and spawning the real
# server binary in integration tests. A runtime dependency would be wrong
# for a thin client.
gardenbed-server = { path = "../server" }
tempfile = "3"
# Dev-only: the server_bin() staleness test touches crates/server/src
# mtimes (dogfood finding #12 regression proof).
filetime = "0.2"
# Dev-only: server_bin()'s content-digest staleness oracle (dogfood #12
# hardening) hashes crates/server/src exactly like crates/server/build.rs.
sha2 = "0.10"
