[package]
name = "gardenbed-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
gardenbed-model.workspace = true
gardenbed-store = { path = "../store" }
gardenbed-derive = { path = "../derive" }
gardenbed-harness = { path = "../harness" }
gardenbed-protocol = { path = "../protocol" }
gardenbed-server = { path = "../server" }
# The bed *library* (not the binary): the sparse/commit/status operations the
# benches measure are library functions the `bed` binary itself calls.
gardenbed = { path = "../bed" }
tempfile = "3"
parking_lot = "0.12.5"
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "process",
    "io-util",
] }

# Unix only: `gardenbed-ab`'s child accounting (wait4/rusage) and disk
# free-space (statvfs). Windows arms report wall time only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# No charts/HTML reports: `cargo bench` prints the numbers; the M8 report
# records them. `cargo_bench_support` keeps `cargo bench` working.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bin]]
name = "gardenbed-ab"
path = "src/bin/ab.rs"

[[bin]]
name = "gen-demo-corpus"
path = "src/bin/gen-demo-corpus.rs"

[[bench]]
name = "sparse_add"
harness = false

[[bench]]
name = "status"
harness = false

[[bench]]
name = "file_read"
harness = false

[[bench]]
name = "commit"
harness = false

[[bench]]
name = "blame"
harness = false
