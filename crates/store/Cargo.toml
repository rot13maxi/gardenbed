[package]
name = "gardenbed-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gardenbed-model.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"

# Scale-out backends (Postgres metadata + S3 objects). Feature-gated so
# pure-local builds (the default keeps the feature ON, matching the
# shipped server binary) can opt out with --no-default-features; see
# docs/scale-out-design.md.
tokio = { version = "1", features = ["rt"] }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
object_store = { version = "0.12", features = ["aws"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
default = []
