[package]
name = "gardenbed-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gardenbed-model.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Portable mtime refresh (utimensat on Unix, SetFileTime on Windows) and
# cross-platform file identity — the rustix fs feature is Unix-only.
gardenbed-platform = { path = "../platform" }
thiserror = "2"
zstd = "0.13"

# Scale-out backends (Postgres metadata + S3 objects). Optional behind
# the `scale` feature so pure-local builds can opt out with
# `--no-default-features`; the feature is ON by default so the shipped
# server binary and the parity tests keep working unchanged. See
# docs/scale-out-design.md.
tokio = { version = "1", features = ["rt"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true }
object_store = { version = "0.12", features = ["aws"], optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["scale"]
scale = [
    "dep:tokio",
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "dep:object_store",
    "dep:toml",
]
