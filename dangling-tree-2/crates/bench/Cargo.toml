[package]
name = "gardenbed-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
gardenbed-model.workspace = true
gardenbed-store = { path = "../store" }
gardenbed-derive = { path = "../derive" }
gardenbed-harness = { path = "../harness" }
gardenbed-protocol = { path = "../protocol" }
gardenbed-server = { path = "../server" }
# The bed *library* (not the binary): the plot/sow/status operations the
# benches measure are library functions the `bed` binary itself calls.
gardenbed = { path = "../bed" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "process",
    "io-util",
] }

[dev-dependencies]
# No plots/HTML reports: `cargo bench` prints the numbers; the M8 report
# records them. `cargo_bench_support` keeps `cargo bench` working.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bin]]
name = "gen-demo-corpus"
path = "src/bin/gen-demo-corpus.rs"

[[bench]]
name = "plot_add"
harness = false

[[bench]]
name = "status"
harness = false

[[bench]]
name = "file_read"
harness = false

[[bench]]
name = "sow"
harness = false

[[bench]]
name = "blame"
harness = false
