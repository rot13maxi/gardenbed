[package]
name = "gardenbed-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gardenbed-model = { workspace = true }
prost = "0.14"
thiserror = "2"
# StreamExt for adapting client-side blob streams.
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14.6", default-features = false, features = [
    "codegen",
    "channel",
] }
# Runtime dep: the generated code's default codec is `tonic_prost::ProstCodec`.
tonic-prost = "0.14.6"

[build-dependencies]
protox = "0.10"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14.6"

[dev-dependencies]
prost-types = "0.14"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
